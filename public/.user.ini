; Raise PHP's upload ceiling so multi-megabyte phone photos are accepted.
; PHP-FPM reads this file from the docroot (public/), so it applies on deploy
; without editing the server by hand. Applies to every upload form (profile
; photos, the photo timeline). post_max_size must be >= upload_max_filesize.
; Note: PHP caches .user.ini for user_ini.cache_ttl seconds (default 300), so
; a change can take up to ~5 minutes or an FPM reload to take effect.
upload_max_filesize = 20M
post_max_size = 24M
